<head>

  <meta name="twitter:title" content="育児記録 - Cape" />
  <meta name="twitter:description" content="育児の記録を、かんたんに。シンプルで続けやすい育児記録アプリです。" />
  <meta name="twitter:image" content="https://toystamp.jp/images/og-cape.png?v=20260727" />
  <meta name="twitter:image:alt" content="育児記録 - Cape。育児の記録を、かんたんに。" />

  <style>
    /* ★変更：明るい配色（育児向けのやさしい雰囲気） */
    :root {
      --bg: #f7fbff;
      --card: rgba(255, 255, 255, 0.75);
      --text: rgba(16, 24, 40, 0.92);
      --muted: rgba(16, 24, 40, 0.68);
      --border: rgba(16, 24, 40, 0.10);

      /* ★変更：パステル寄りのアクセント */
      --accent1: #5eead4;
      /* mint */
      --accent2: #93c5fd;
      /* sky */
      --accent3: #fbcfe8;
      /* pink */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
        "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);

      /* ★変更：明るい背景グラデ＋やさしい色玉 */
      background:
        radial-gradient(900px 520px at 10% 0%, rgba(94, 234, 212, 0.30), transparent 60%),
        radial-gradient(900px 520px at 90% 10%, rgba(147, 197, 253, 0.28), transparent 55%),
        radial-gradient(900px 520px at 60% 90%, rgba(251, 207, 232, 0.25), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 24px 68px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 34px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      width: fit-content;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.60);
      /* ★変更 */
      border-radius: 999px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      color: var(--muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.20);
      /* ★変更 */
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 58px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 0;
      font-size: 17px;
      color: var(--muted);
      line-height: 1.9;
      max-width: 80ch;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .span2 {
        grid-column: span 2;
      }
    }

    .card {
      min-width: 0;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.86);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(12px);

      box-shadow:
        0 16px 40px rgba(16, 24, 40, 0.07),
        0 1px 0 rgba(255, 255, 255, 0.60) inset;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.9;
      font-size: 15px;
    }

    /* ★変更：リンクを明るく（青系） */
    a {
      color: rgba(2, 132, 199, 0.95);
      text-decoration: none;
      border-bottom: 1px dashed rgba(2, 132, 199, 0.35);
    }

    a:hover {
      border-bottom-color: rgba(2, 132, 199, 0.75);
    }

    .app-summary {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .app-icon {
      flex: 0 0 auto;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.14);
    }

    .app-name {
      display: block;
      margin-bottom: 5px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .app-tagline {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .app-description {
      margin-top: 18px;
    }

    .download-area {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .contact-email {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(147, 197, 253, 0.12);
      text-align: center;
    }

    .features-intro {
      max-width: 64ch;
    }

    .screenshot-gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .screenshot-item {
      min-width: 0;
      margin: 0;
      padding: 7px 7px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.07);
      overflow: hidden;
    }

    .screenshot-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 13px;
      background: transparent;
      cursor: zoom-in;
      overflow: hidden;
    }

    .screenshot-button:focus-visible {
      outline: 3px solid rgba(2, 132, 199, 0.38);
      outline-offset: 3px;
    }

    .screenshot-button img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 13px;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .screenshot-button:hover img {
      transform: scale(1.015);
      filter: saturate(1.03);
    }

    .screenshot-item figcaption {
      margin-top: 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    .modal-open {
      overflow: hidden;
    }

    .screenshot-modal {
      position: fixed;
      inset: 0;
      width: min(96vw, 820px);
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }

    .screenshot-modal::backdrop {
      background: rgba(8, 15, 28, 0.76);
      backdrop-filter: blur(16px);
      animation: backdrop-in 0.2s ease-out;
    }

    .screenshot-modal[open] {
      animation: modal-in 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-shell {
      position: relative;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 14px;
    }

    .modal-content {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
    }

    .modal-image-viewport {
      height: 78vh;
      min-height: 0;
      border-radius: 18px;
      overflow: hidden;
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
    }

    .modal-image-viewport.is-dragging {
      cursor: grabbing;
    }

    .modal-track {
      display: flex;
      width: 300%;
      height: 100%;
      transform: translate3d(-33.333333%, 0, 0);
      will-change: transform;
    }

    .modal-track.is-animating {
      transition: transform 320ms cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    .modal-slide {
      display: flex;
      flex: 0 0 33.333333%;
      justify-content: center;
      align-items: center;
      min-width: 0;
      height: 100%;
    }

    .modal-image {
      display: block;
      width: auto;
      max-width: 100%;
      height: 100%;
      max-height: none;
      border-radius: 18px;
      object-fit: contain;
    }

    .modal-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 8px 2px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .modal-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .modal-close,
    .modal-nav {
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: rgba(16, 24, 40, 0.88);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .modal-close:hover,
    .modal-nav:hover,
    .modal-close:focus-visible,
    .modal-nav:focus-visible {
      transform: scale(1.06);
      background: #fff;
    }

    .modal-close:focus-visible,
    .modal-nav:focus-visible {
      outline: 3px solid rgba(147, 197, 253, 0.75);
      outline-offset: 3px;
    }

    .modal-close {
      position: absolute;
      z-index: 2;
      top: -18px;
      right: 48px;
      width: 44px;
      height: 44px;
      font-size: 28px;
      line-height: 1;
    }

    .modal-close::before,
    .modal-close::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform-origin: center;
    }

    .modal-close::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .modal-close::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .modal-nav {
      width: 52px;
      height: 52px;
    }

    .modal-nav::before {
      content: "";
      width: 11px;
      height: 11px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform-origin: center;
    }

    .modal-prev::before {
      transform: rotate(-135deg);
    }

    .modal-next::before {
      transform: rotate(45deg);
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes backdrop-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .store-badge-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-width: 0;
      border: 0;
      border-radius: 10px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .store-badge-link:hover,
    .store-badge-link:focus-visible {
      transform: translateY(-1px);
      border-bottom-color: transparent;
      filter: drop-shadow(0 8px 10px rgba(16, 24, 40, 0.12));
    }

    .store-badge-link:focus-visible {
      outline: 3px solid rgba(2, 132, 199, 0.35);
      outline-offset: 3px;
    }

    .store-badge {
      display: block;
      width: auto;
      max-width: 100%;
    }

    .app-store-badge {
      height: 48px;
    }

    .google-play-badge {
      height: 48px;
    }

    .store-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 12px;
      max-width: 390px;
      margin: 0 auto;
    }

    @media (max-width: 520px) {
      .wrap {
        padding: 42px 18px 54px;
      }

      .hero {
        margin-bottom: 26px;
      }

      h1 {
        font-size: 38px;
      }

      .sub {
        font-size: 15px;
      }

      .card {
        padding: 22px 20px;
        border-radius: 22px;
      }

      .app-summary {
        gap: 14px;
      }

      .app-icon {
        width: 68px;
        height: 68px;
        border-radius: 17px;
      }

      .app-name {
        font-size: 16px;
      }

      .app-tagline {
        font-size: 13px;
      }

      .app-store-badge,
      .google-play-badge {
        height: 44px;
      }

      .screenshot-gallery {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: min(72vw, 240px);
        gap: 12px;
        margin-right: -20px;
        padding: 0 20px 12px 0;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }

      .screenshot-item {
        scroll-snap-align: start;
      }

      .screenshot-modal {
        width: 100vw;
      }

      .modal-shell {
        display: block;
        padding: 18px;
      }

      .modal-content {
        padding: 8px;
        border-radius: 22px;
      }

      .modal-image {
        border-radius: 16px;
      }

      .modal-close {
        top: 2px;
        right: 8px;
      }

      .modal-nav {
        position: absolute;
        z-index: 2;
        top: 50%;
        width: 44px;
        height: 44px;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.88);
      }

      .modal-nav:hover,
      .modal-nav:focus-visible {
        transform: translateY(-50%) scale(1.05);
      }

      .modal-prev {
        left: 2px;
      }

      .modal-next {
        right: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    footer {
      margin-top: 26px;
      color: rgba(16, 24, 40, 0.45);
      /* ★変更 */
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">
        <span class="dot" aria-hidden="true"></span>
        <span>育児記録アプリ</span>

      <h1>育児記録 - Cape</h1>

    <footer>
      © <span id="y"></span> ToyStamp Works. All rights reserved.

  </main>

  <dialog class="screenshot-modal" id="screenshot-modal" aria-labelledby="modal-caption">
    <div class="modal-shell">
      <button class="modal-nav modal-prev" type="button" aria-label="前の画像"></button>

      <div class="modal-content">
        <div class="modal-image-viewport" id="modal-image-viewport">
          <div class="modal-track" id="modal-track">
            <div class="modal-slide" aria-hidden="true">
              <img class="modal-image" id="modal-image-prev" src="" alt="" draggable="false" />
            </div>
            <div class="modal-slide">
              <img class="modal-image" id="modal-image" src="" alt="" draggable="false" />
            </div>
            <div class="modal-slide" aria-hidden="true">
              <img class="modal-image" id="modal-image-next" src="" alt="" draggable="false" />
            </div>
          </div>
        </div>
        <div class="modal-meta">
          <span id="modal-caption"></span>
          <span class="modal-count" id="modal-count"></span>
        </div>
      </div>

      <button class="modal-nav modal-next" type="button" aria-label="次の画像"></button>
      <button class="modal-close" type="button" aria-label="拡大表示を閉じる"></button>
    </div>
  </dialog>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const modal = document.getElementById('screenshot-modal');
    const modalViewport = document.getElementById('modal-image-viewport');
    const modalTrack = document.getElementById('modal-track');
    const modalPrevImage = document.getElementById('modal-image-prev');
    const modalImage = document.getElementById('modal-image');
    const modalNextImage = document.getElementById('modal-image-next');
    const modalCaption = document.getElementById('modal-caption');
    const modalCount = document.getElementById('modal-count');
    const screenshotButtons = Array.from(document.querySelectorAll('.screenshot-button'));
    let currentScreenshot = 0;
    let isSliding = false;
    let activePointerId = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartTime = 0;
    let dragDeltaX = 0;
    let dragAxis = null;

    function normalizeScreenshotIndex(index) {
      return (index + screenshotButtons.length) % screenshotButtons.length;
    }

    function getScreenshotData(index) {
      const button = screenshotButtons[normalizeScreenshotIndex(index)];
      const image = button.querySelector('img');
      const caption = button.closest('.screenshot-item').querySelector('figcaption').textContent;
      return {
        src: image.currentSrc || image.src,
        alt: image.alt,
        caption
      };
    }

    function renderModalSlides() {
      const previous = getScreenshotData(currentScreenshot - 1);
      const current = getScreenshotData(currentScreenshot);
      const next = getScreenshotData(currentScreenshot + 1);

      modalPrevImage.src = previous.src;
      modalImage.src = current.src;
      modalNextImage.src = next.src;
      modalImage.alt = current.alt;
      modalCaption.textContent = current.caption;
      modalCount.textContent = `${currentScreenshot + 1} / ${screenshotButtons.length}`;

      modalTrack.classList.remove('is-animating');
      modalViewport.classList.remove('is-dragging');
      modalTrack.style.transform = 'translate3d(-33.333333%, 0, 0)';
    }

    function showScreenshot(index) {
      currentScreenshot = normalizeScreenshotIndex(index);
      isSliding = false;
      renderModalSlides();
    }

    function slideScreenshot(direction) {
      if (isSliding) return;
      isSliding = true;
      modalViewport.classList.remove('is-dragging');
      modalTrack.classList.add('is-animating');

      const destination = direction > 0 ? '-66.666667%' : '0%';
      requestAnimationFrame(() => {
        modalTrack.style.transform = `translate3d(${destination}, 0, 0)`;
      });

      let completed = false;
      const finish = () => {
        if (completed) return;
        completed = true;
        modalTrack.removeEventListener('transitionend', handleTransitionEnd);
        currentScreenshot = normalizeScreenshotIndex(currentScreenshot + direction);
        renderModalSlides();
        isSliding = false;
      };
      const handleTransitionEnd = (event) => {
        if (event.target === modalTrack && event.propertyName === 'transform') finish();
      };

      modalTrack.addEventListener('transitionend', handleTransitionEnd);
      window.setTimeout(finish, 380);
    }

    function restoreCurrentScreenshot() {
      if (isSliding) return;
      isSliding = true;
      modalViewport.classList.remove('is-dragging');
      modalTrack.classList.add('is-animating');

      requestAnimationFrame(() => {
        modalTrack.style.transform = 'translate3d(-33.333333%, 0, 0)';
      });

      let completed = false;
      const finish = () => {
        if (completed) return;
        completed = true;
        modalTrack.removeEventListener('transitionend', handleTransitionEnd);
        modalTrack.classList.remove('is-animating');
        isSliding = false;
      };
      const handleTransitionEnd = (event) => {
        if (event.target === modalTrack && event.propertyName === 'transform') finish();
      };

      modalTrack.addEventListener('transitionend', handleTransitionEnd);
      window.setTimeout(finish, 380);
    }

    screenshotButtons.forEach((button, index) => {
      button.addEventListener('click', () => {
        showScreenshot(index);
        modal.showModal();
        document.body.classList.add('modal-open');
      });
    });

    document.querySelector('.modal-close').addEventListener('click', () => modal.close());
    document.querySelector('.modal-prev').addEventListener('click', () => slideScreenshot(-1));
    document.querySelector('.modal-next').addEventListener('click', () => slideScreenshot(1));

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.close();
      }
    });

    modal.addEventListener('close', () => {
      document.body.classList.remove('modal-open');
      activePointerId = null;
      isSliding = false;
      renderModalSlides();
    });

    modal.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        modal.close();
      } else if (event.key === 'ArrowLeft') {
        slideScreenshot(-1);
      } else if (event.key === 'ArrowRight') {
        slideScreenshot(1);
      }
    });

    modalViewport.addEventListener('pointerdown', (event) => {
      if (isSliding || event.button !== 0) return;

      activePointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragStartTime = performance.now();
      dragDeltaX = 0;
      dragAxis = null;
      modalTrack.classList.remove('is-animating');
      modalViewport.setPointerCapture(event.pointerId);
    });

    modalViewport.addEventListener('pointermove', (event) => {
      if (event.pointerId !== activePointerId || isSliding) return;

      const deltaX = event.clientX - dragStartX;
      const deltaY = event.clientY - dragStartY;

      if (!dragAxis && (Math.abs(deltaX) > 6 || Math.abs(deltaY) > 6)) {
        dragAxis = Math.abs(deltaX) > Math.abs(deltaY) ? 'x' : 'y';
      }
      if (dragAxis !== 'x') return;

      event.preventDefault();
      dragDeltaX = deltaX;
      modalViewport.classList.add('is-dragging');
      modalTrack.style.transform = `translate3d(calc(-33.333333% + ${dragDeltaX}px), 0, 0)`;
    }, { passive: false });

    function finishPointerGesture(event) {
      if (event.pointerId !== activePointerId) return;

      if (modalViewport.hasPointerCapture(event.pointerId)) {
        modalViewport.releasePointerCapture(event.pointerId);
      }
      activePointerId = null;

      if (dragAxis !== 'x') {
        dragAxis = null;
        return;
      }

      const elapsed = Math.max(performance.now() - dragStartTime, 1);
      const velocity = dragDeltaX / elapsed;
      const threshold = Math.min(90, modalViewport.clientWidth * 0.22);
      const shouldMove = Math.abs(dragDeltaX) >= threshold || Math.abs(velocity) >= 0.45;
      const direction = dragDeltaX < 0 ? 1 : -1;

      dragAxis = null;
      if (shouldMove) {
        slideScreenshot(direction);
      } else {
        restoreCurrentScreenshot();
      }
    }

    modalViewport.addEventListener('pointerup', finishPointerGesture);
    modalViewport.addEventListener('pointercancel', finishPointerGesture);
    modalViewport.addEventListener('dragstart', (event) => event.preventDefault());
  </script>
</body>

</html>
